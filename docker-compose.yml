services:
  postgres:
    image: postgres:16-alpine
    container_name: doctore-ai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: doctore_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - doctore_ai_pg:/var/lib/postgresql/data

volumes:
  doctore_ai_pg:
